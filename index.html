        <main>
          <section>
            <h2>Repertório publicado pela comunidade</h2>
            <p>O Cânticos CCB é uma plataforma independente para descobrir, ouvir, ler e estudar repertório publicado voluntariamente pelos membros. Acesse hinos cantados e tocados, cifras musicais, perfis de compositores, letras e playlists temáticas.</p>
          </section>
          <section>
            <h2>Hinário 5 — Hinos de Louvores e Súplicas a Deus</h2>
            <p>O catálogo reúne hinos, letras e repertórios publicados voluntariamente pelos membros. No Cânticos CCB você pode ouvir conteúdos online e estudar as cifras disponíveis.</p>
          </section>
          <section>
            <h2>Cifras de Hinos da CCB</h2>
            <p>Encontre cifras e tablaturas de hinos da CCB com transposição de tom em tempo real. Ideal para músicos que desejam tocar os hinos em violão, teclado e outros instrumentos.</p>
          </section>
          <section>
            <h2>Compositores da CCB</h2>
            <p>Conheça os compositores e colaboradores da comunidade. Acesse biografias, discografias e os conteúdos associados a cada perfil.</p>
          </section>
          <section>
            <h2>Perguntas Frequentes</h2>
            <h3>Como ouvir hinos publicados pela comunidade?</h3>
            <p>No Cânticos CCB você pode ouvir hinos publicados gratuitamente, tanto cantados quanto tocados (instrumentais). Basta acessar www.canticosccb.com.br e buscar pelo número ou nome do hino.</p>
            <h3>O que é o Hinário 5 da CCB?</h3>
            <p>O Cânticos CCB reúne conteúdos musicais publicados voluntariamente pelos membros, com letras, cifras e repertórios para ouvir e estudar.</p>
            <h3>Quantos hinos tem o Hinário 5?</h3>
            <p>A plataforma organiza repertórios por título, categoria, compositor e instrumento, conforme os conteúdos publicados pela comunidade.</p>
            <h3>O que são cifras de hinos da CCB?</h3>
            <p>Cifras são representações simplificadas das notas musicais e acordes de um hino, permitindo que músicos toquem os hinos em instrumentos como violão, teclado e outros.</p>
          </section>
