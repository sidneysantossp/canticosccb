<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cânticos CCB - Plataforma de Hinos</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Meta tags básicas -->
    <meta name="description" content="Plataforma oficial de hinos da Congregação Cristã no Brasil">
    <meta name="theme-color" content="#10b981">
  </head>
  <body style="background-color: #121212 !important; color: #ffffff !important; margin: 0; padding: 0; font-family: 'Montserrat', system-ui, sans-serif;">
    <div id="root" style="background-color: #121212 !important; color: #ffffff !important; min-height: 100vh; width: 100%;"></div>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML = '<div style="padding:40px;color:#ff6b6b;font-family:monospace;max-width:800px;margin:0 auto;">' +
            '<h2 style="color:#ff6b6b;">Erro ao carregar aplicação</h2>' +
            '<p style="color:#ccc;">Mensagem: ' + (e.message || 'Unknown') + '</p>' +
            '<p style="color:#ccc;">Arquivo: ' + (e.filename || 'Unknown') + '</p>' +
            '<p style="color:#ccc;">Linha: ' + (e.lineno || '?') + ':' + (e.colno || '?') + '</p>' +
            '</div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML = '<div style="padding:40px;color:#ff6b6b;font-family:monospace;max-width:800px;margin:0 auto;">' +
            '<h2 style="color:#ff6b6b;">Erro ao carregar aplicação</h2>' +
            '<p style="color:#ccc;">Promise rejeitada: ' + (e.reason ? (e.reason.message || String(e.reason)) : 'Unknown') + '</p>' +
            '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
