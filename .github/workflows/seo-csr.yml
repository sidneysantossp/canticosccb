name: SEO CSR smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-csr:
    name: Renderização CSR de Hinos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Executar smoke test CSR
        run: npm run test:seo-csr
