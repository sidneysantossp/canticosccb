name = "canticosccb"
compatibility_date = "2026-04-19"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = "dist"

# R2 binding — o endpoint acessa `env.MEDIA_BUCKET` direto,
# sem precisar de R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY em env vars.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "canticos-media"
preview_bucket_name = "canticos-media"
